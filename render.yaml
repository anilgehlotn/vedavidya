# Render blueprint: New > Blueprint, pick this repo.
# The Claude API key is added inside the app: Settings → AI engine (stored encrypted per institute).
services:
  - type: web
    name: vedavidya
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: ALLOW_SIGNUP
        value: "true"
      - key: EVAL_CONCURRENCY
        value: "3"
    disk:
      name: vedavidya-data
      mountPath: /data
      sizeGB: 5
