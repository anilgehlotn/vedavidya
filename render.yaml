# Render blueprint: New > Blueprint, pick this repo. Add ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: vedavidya
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_DEMO
        value: "true"
    disk:
      name: vedavidya-data
      mountPath: /data
      sizeGB: 5
